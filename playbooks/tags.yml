
---
- name: Tags Playbook
  hosts: all
  become: yes
  tasks:
    - name: Installing Git
      apt: name=git state=present
      tags: git

    - name: Installing apache2
      apt: name=apache2 state=present
      tags: apache

# run only that command which has that specific tag 
#  here it is git ansible-playbook tags.yml --tags git
# mentioned tags will skip
# ansible-playbook tags.yml --skip-tags "git" 